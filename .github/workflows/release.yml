name: release

# Builds the agent for every platform a machine might join from, and attaches
# them to the tag. Until this runs once there is nothing for scripts/install.sh
# to download, which is the whole reason a `curl | sh` install does not work yet.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every agent
        run: |
          set -eu
          mkdir -p dist
          version="${GITHUB_REF_NAME:-dev}"
          # CGO off: SQLite here is pure Go and the agent needs none of it, so
          # every one of these is a static binary that runs on any distribution
          # without asking about libc.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=$version" \
              -o "dist/nfagent-$os-$arch" ./cmd/nfagent
          done
          # The signalling server and the relay live here too: they are the two
          # halves of the same protocol as the agent, and a release where they
          # can disagree about it is not one worth having.
          for target in linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            for cmd in nfsignal nfrelay; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags="-s -w" \
                -o "dist/$cmd-$os-$arch" "./cmd/$cmd"
            done
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # The signature over SHA256SUMS is what an agent checks before it replaces
      # itself, and every binary's digest is in that one file — so one signature
      # covers the release and there is no way to pair an old binary with a new
      # list.
      #
      # A missing key does not fail the build. It produces an unsigned release,
      # which agents refuse to install: safe, loud in the log, and installable
      # by hand. Failing here instead would mean a broken release pipeline the
      # first time somebody rotates the secret.
      - name: Sign the checksums
        env:
          NFSIGN_KEY: ${{ secrets.NFSIGN_KEY }}
        run: |
          if [ -z "${NFSIGN_KEY:-}" ]; then
            echo "::warning::NFSIGN_KEY is not set — this release is UNSIGNED and no agent will install it automatically"
            exit 0
          fi
          go run ./cmd/nfsign sign dist/SHA256SUMS
          ls -la dist/SHA256SUMS.sig

      # The window is not here. It needs cgo and the platform's own web view,
      # so it is built on the machine it runs on by release-ui.yml, which
      # attaches its bundle to this same release.

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
