name: release-ui

# The window, built on macOS because it has to be.
#
# wails links against the system's web view through cgo, so this cannot be
# cross compiled from the Linux runner that builds everything else: the cross
# build links and produces a binary that opens nothing and reports no error,
# which is the worst of both.
#
# What is still missing before this is something a person can just download:
# signing and notarisation. The bundle below is signed by nobody, and macOS
# refuses an unsigned application that arrived from the internet more firmly
# than one built on the machine. The certificate is an Apple developer account.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: desktop
        run: |
          set -eu
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          # Both architectures in one bundle: a universal binary is the only
          # form somebody can be handed without being asked which Mac they have.
          make dmg VERSION="${GITHUB_REF_NAME}" WAILS_PLATFORM=darwin/universal
          mv build/bin/*.dmg netflow-macos.dmg
          shasum -a 256 netflow-macos.dmg > SHA256SUMS-ui
          cat SHA256SUMS-ui
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/netflow-macos.dmg
            desktop/SHA256SUMS-ui
